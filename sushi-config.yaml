
# Documentation :
# https://fshschool.org/docs/sushi/configuration/

# ==========================================
# HUG - FHIR Implementation Guide
# ==========================================

id: org.fhir.ch.hug-training
canonical: https://example.org/ig/hug-training
name: HUGTrainingIG
title: "HUG FHIR Implementation Guide - Formation"
description: "Implementation Guide FHIR de demonstration pour les Hôpitaux universitaires de Genève (HUG)"

publisher:
  name: "Hôpitaux universitaires de Genève (démonstration)"
  url: https://www.hug.ch

status: draft
version: 0.1.0
fhirVersion: 4.0.1
copyrightYear: 2026+
releaseLabel: ci-build

# ==========================================
# Juridiction
# ==========================================

jurisdiction: urn:iso:std:iso:3166#CH "Switzerland"

# ==========================================
# Dependances FHIR
# ==========================================

dependencies:
  ch.fhir.ig.ch-core: 6.0.0

# ==========================================
# Parametres IG Publisher
# ==========================================

parameters:
  shownav: 'true'

  pin-canonicals: pin-all

  path-suppressed-warnings: input/ignoreWarnings.txt

  apply-contact: true

  show-inherited-invariants: true

  logging:
    - tx
    - html
    - generate
    - init
    - progress

  # Langue principale : francais
  i18n-default-lang: fr

  apply-jurisdiction: true

  # Traduction anglaise
  i18n-lang:
    - en

  translation-sources:
    - input/translations/en

# ==========================================
# Pages de documentation
# ==========================================

pages:
  index.md:
    title: Home

  introduction.md:
    title: Introduction

  functional.md:
    title: Functional

  implementation.md:
    title: Implementation

  about.md:
    title: About

# ==========================================
# Menu de navigation
# ==========================================

menu:
  Home: index.html
  Introduction: introduction.html
  Functional: functional.html
  Implementation: implementation.html
  About: about.html
  Artifacts: artifacts.html
